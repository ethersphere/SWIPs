// Broadcast Pub/Sub (BPS) — protocol messages and types.
// Spec: SWIP-60 (../../swip-60.md).
//
// Deliberately incomplete as of 2026-08-02: the singlehop (depth = 1) subset is
// concrete; multihop control-plane messages are named but reserved. The existing
// implementation (bee PR #5435) uses hand-rolled byte framing with the same
// semantics; this file is the normative description of the message structure,
// and — bee protocols being protobuf-over-libp2p elsewhere — the candidate
// replacement framing.

syntax = "proto3";
package bps;

option go_package = "github.com/ethersphere/bee/v2/pkg/bps/pb";

// ---------------------------------------------------------------------------
// Cohort genesis — the primitive decisions whose combinations are the "modes"
// ---------------------------------------------------------------------------

// What the topic binds to (see epic: "What does the topic bind to?").
enum TopicBinding {
  TOPIC_BINDING_UNSPECIFIED = 0;
  ANCHOR     = 1; // topic = full SOC/GSOC address; dedup on the wrapped CAC
  SOC_ID     = 2; // topic = SOC id; any owner with PO(addr, anchor) >= po_min
  OWNER      = 3; // topic = SOC owner; any id with PO(addr, anchor) >= po_min (MIC)
  FEED_TOPIC = 4; // id = keccak256(topic ‖ index); graffiti MIC / feed streams
}

// Who may author (see epic: genesis dimensions).
enum PublisherRegime {
  PUBLISHER_REGIME_UNSPECIFIED = 0;
  EXPLICIT_SINGLE = 1; // opener is admin and sole publisher (live streaming)
  EXPLICIT_LIST   = 2; // admin dictates who the other publishers are
  IMPLICIT        = 3; // authorship implied by the topic binding (PO constraint)
  ALL             = 4; // every peer publishes (gossipsub-equivalent cohort)
}

// The (partial) decisions fixed the moment the first full node is contacted.
message CohortSpec {
  bytes           topic      = 1; // 32 bytes, meaning per binding
  TopicBinding    binding    = 2;
  PublisherRegime publishers = 3;
  bool            history    = 4; // deliver matching chunks from the local store
  bytes           admin      = 5; // 20-byte eth address; set iff EXPLICIT_*
  uint32          po_min     = 6; // proximity order for implicit bindings (default 16)
  uint32          cap        = 7; // max direct streams the broker accepts for this topic (0 = broker default)
  bool            closed     = 8; // no audience: subscribers restricted to the publisher list
}

// ---------------------------------------------------------------------------
// Stream establishment (client -> broker), stream name "pubsub/1.0.0"
// ---------------------------------------------------------------------------

enum Role {
  ROLE_UNSPECIFIED = 0;
  SUBSCRIBER = 1;
  PUBLISHER  = 2; // implies direct connection to the broker (necessary, not sufficient)
}

message Connect {
  CohortSpec    cohort = 1;
  Role          role   = 2;
  PublisherAuth auth   = 3; // present iff role == PUBLISHER
}

message PublisherAuth {
  bytes owner = 1; // 20-byte eth address of the SOC owner key
  bytes id    = 2; // 32-byte SOC id, when the binding fixes it
}

// ---------------------------------------------------------------------------
// Messages — SOC-only is a protocol feature
// ---------------------------------------------------------------------------

// A full single-owner chunk in transit.
message Soc {
  bytes id        = 1; // 32 bytes
  bytes owner     = 2; // 20 bytes (recoverable from signature; explicit for cheap filtering)
  bytes signature = 3; // 65 bytes
  bytes span      = 4; // 8 bytes LE
  bytes payload   = 5; // wrapped-CAC data, <= 4096 bytes
}

// Publisher -> broker. No type prefix needed: the stream's role was declared at Connect.
message Publish {
  Soc soc = 1;
}

// Broker -> subscriber: exactly one of the following per frame.
message Broadcast {
  oneof frame {
    Soc       handshake = 1; // first frame on a stream: full SOC identity
    DataFrame data      = 2; // subsequent frames: signature ‖ span ‖ payload only
    Ping      ping      = 3; // keepalive; parent measures RTT off the echo
  }
}

message DataFrame {
  bytes signature = 1;
  bytes span      = 2;
  bytes payload   = 3;
}

message Ping {}

// ---------------------------------------------------------------------------
// Multihop control plane — RESERVED, named to fix intent (not final for AFM)
// ---------------------------------------------------------------------------
// message Beacon        {}  // child -> parent capacity/score summary (0xFE)
// message Reparent      {}  // parent -> child: REPARENT{to, gateway?}   (0xFD)
// message Expect        {}  // parent -> relay: EXPECT{children}         (0xFC)
// message DcutrSignal   {}  // via circuit relay                          (0xFB)
// message SwapProposal  {}  // promotion swap propose/ack                 (0xFA)
