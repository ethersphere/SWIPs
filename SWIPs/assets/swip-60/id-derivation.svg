<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1120" height="700" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111" font-weight="bold">How a chunk&#x27;s id is derived from the frame, and where it is validated</text>
<rect x="20" y="50" width="260" height="150" rx="6" fill="#f3f6fb" stroke="#444" stroke-width="1.2"/>
<text x="30" y="68" font-weight="bold" fill="#111">Broadcast  (the frame)</text>
<rect x="30" y="78" width="240" height="24" rx="6" fill="#ffe9b8" stroke="#777" stroke-width="1.2"/>
<text x="38" y="94" font-size="12" fill="#111">kind</text>
<text x="112" y="94" font-size="10" fill="#333">1 byte, enum</text>
<rect x="30" y="107" width="240" height="24" rx="6" fill="#d9f2e3" stroke="#777" stroke-width="1.2"/>
<text x="38" y="123" font-size="12" fill="#111">challenge</text>
<text x="112" y="123" font-size="10" fill="#333">32 bytes, the stream&#x27;s</text>
<rect x="30" y="136" width="240" height="24" rx="6" fill="#e3ddf7" stroke="#777" stroke-width="1.2"/>
<text x="38" y="152" font-size="12" fill="#111">index</text>
<text x="112" y="152" font-size="10" fill="#333">8 bytes, big-endian</text>
<rect x="30" y="165" width="240" height="24" rx="6" fill="#f7e1e1" stroke="#777" stroke-width="1.2"/>
<text x="38" y="181" font-size="12" fill="#111">soc</text>
<text x="112" y="181" font-size="10" fill="#333">the chunk, 105 + payload</text>
<rect x="20" y="230" width="260" height="90" rx="6" fill="#f3f6fb" stroke="#444" stroke-width="1.2"/>
<text x="30" y="248" font-weight="bold" fill="#111">CohortSpec  (from Join)</text>
<rect x="30" y="258" width="240" height="24" rx="6" fill="#d6ecf7" stroke="#777" stroke-width="1.2"/>
<text x="38" y="274" font-size="12" fill="#111">topic</text>
<text x="112" y="274" font-size="10" fill="#333">32 bytes</text>
<rect x="30" y="287" width="240" height="24" rx="6" fill="#fbe3c9" stroke="#777" stroke-width="1.2"/>
<text x="38" y="303" font-size="12" fill="#111">principal</text>
<text x="112" y="303" font-size="10" fill="#333">20 bytes, eth address</text>
<rect x="340" y="50" width="760" height="72" rx="6" fill="#fffaf0" stroke="#444" stroke-width="1.2"/>
<text x="350" y="68" font-weight="bold" fill="#111">1  prefix  &lt;-  kind</text>
<text x="352" y="86" font-size="12" fill="#111">DATA    -&gt;  (empty)</text>
<text x="352" y="104" font-size="12" fill="#111">AUTH    -&gt;  &quot;bps-service:v1&quot; || 0x02</text>
<text x="720" y="86" font-size="12" fill="#111">EOS     -&gt;  &quot;bps-service:v1&quot; || 0x03</text>
<text x="720" y="104" font-size="12" fill="#111">ROSTER  -&gt;  &quot;bps-service:v1&quot; || 0x04</text>
<rect x="340" y="144" width="760" height="52" rx="6" fill="#f0fff4" stroke="#444" stroke-width="1.2"/>
<text x="350" y="162" font-weight="bold" fill="#111">2  topic_s  =  keccak256( prefix || topic || challenge )</text>
<text x="352" y="184" font-size="10" fill="#333">the session feed of this kind: the topic salted with the challenge the broker drew for the stream; one feed per kind</text>
<rect x="340" y="218" width="760" height="52" rx="6" fill="#f5f0ff" stroke="#444" stroke-width="1.2"/>
<text x="350" y="236" font-weight="bold" fill="#111">3  id  =  keccak256( topic_s || index )</text>
<text x="352" y="258" font-size="10" fill="#333">index as 8 bytes big-endian: the AUTH is at index 0 of its feed, a DATA update at its feed index</text>
<rect x="340" y="292" width="760" height="96" rx="6" fill="#fff5f5" stroke="#444" stroke-width="1.2"/>
<text x="350" y="310" font-weight="bold" fill="#111">4  the chunk must carry that id:   soc = id || signature || span || payload</text>
<rect x="352" y="322" width="90" height="26" rx="6" fill="#e3ddf7" stroke="#777" stroke-width="1.2"/>
<text x="358" y="339" font-size="10" fill="#111">id 32</text>
<rect x="442" y="322" width="160" height="26" rx="6" fill="#f7e1e1" stroke="#777" stroke-width="1.2"/>
<text x="448" y="339" font-size="10" fill="#111">signature 65</text>
<rect x="602" y="322" width="120" height="26" rx="6" fill="#eeeeee" stroke="#777" stroke-width="1.2"/>
<text x="608" y="339" font-size="10" fill="#111">span 8, LE</text>
<rect x="722" y="322" width="360" height="26" rx="6" fill="#f7f7d9" stroke="#777" stroke-width="1.2"/>
<text x="728" y="339" font-size="10" fill="#111">payload &lt;= 4096   (AUTH: span 0, no payload)</text>
<text x="352" y="366" font-size="10" fill="#333">the receiver derives the id from the frame and requires soc[0:32] to equal it:</text>
<text x="352" y="380" font-size="10" fill="#333">kind, challenge and index are not trusted, they are bound through the id&#x27;s preimage</text>
<rect x="340" y="410" width="760" height="72" rx="6" fill="#f0f6ff" stroke="#444" stroke-width="1.2"/>
<text x="350" y="428" font-weight="bold" fill="#111">5  address  =  keccak256( id || principal )      validate the SOC at this address</text>
<text x="352" y="450" font-size="10" fill="#333">BMT(span || payload) = wrapped address;  the signature over keccak256(id || wrapped) recovers an owner;</text>
<text x="352" y="465" font-size="10" fill="#333">keccak256(id || owner) must equal the address: the owner is forced to the principal, not read from the key</text>
<line x1="270" y1="90" x2="340" y2="90" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M270,119 C315,119 295,170 340,170" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M270,148 C315,148 295,244 340,244" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M270,177 C315,177 295,314 340,314" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M270,270 C315,270 295,182 340,182" fill="none" stroke="#2a7f4f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<path d="M270,299 C315,299 295,436 340,436" fill="none" stroke="#b5551d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="700" y1="122" x2="700" y2="144" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="700" y1="196" x2="700" y2="218" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="700" y1="270" x2="700" y2="292" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="700" y1="388" x2="700" y2="410" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="20" y="506" font-size="11" fill="#111">Nothing in the frame is signed. The kind, the challenge and the index are bound because the id the chunk</text>
<text x="20" y="522" font-size="11" fill="#111">is signed under is derived from them: change any one and the derived id is not the chunk&#x27;s, so the frame</text>
<text x="20" y="538" font-size="11" fill="#111">is refused before the signature is checked.</text>
<text x="20" y="560" font-size="10" fill="#333">SWIP-60: for EOS and ROSTER the owner is the admin in every configuration; under ALL it is the stream&#x27;s declared</text>
<text x="20" y="574" font-size="10" fill="#333">address; under implicit authorship there is no challenge, the frame&#x27;s challenge and index are unset, and the id is</text>
<text x="20" y="588" font-size="10" fill="#333">whatever the binding&#x27;s SOC shape says.</text>
</svg>